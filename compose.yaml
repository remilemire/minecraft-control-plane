# compose.yaml
#
# Shared config for both environments. Dev-only additions live in
# compose.override.yaml (auto-loaded by plain `docker compose`); prod
# additions in compose.prod.yaml (the Makefile passes
# `-f compose.yaml -f compose.prod.yaml` when APP_ENV=prod).

# Pinned (rather than derived from the directory name) because the controller
# finds the minecraft container by its com.docker.compose.project label.
name: ${MINECRAFT_COMPOSE_PROJECT}

services:
  db:
    image: postgres:18

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}

    # Gates the backend's boot (depends_on: service_healthy) so prod's
    # migrate-on-boot never races the database's first start. $$-escaped so
    # the CONTAINER's env expands them — where the name is POSTGRES_DB.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    volumes:
      - postgres-data:/var/lib/postgresql

  minecraft:
    image: itzg/minecraft-server

    ports:
      - "25565:25565"

    volumes:
      - ${MINECRAFT_DATA_ROOT:-./data}/minecraft:/data

    # No env_file: this container must not see the rest of the root .env —
    # notably MINECRAFT_CONTROLLER_TOKEN, which guards the controller against
    # a compromised sibling container (this one included).
    environment:
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${MINECRAFT_RCON_PASSWORD}"
      EULA: "TRUE"
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      VERSION: "${MINECRAFT_VERSION}"
      PAPER_BUILD: "${MINECRAFT_PAPER_BUILD:-}"
      TYPE: "${MINECRAFT_TYPE}"
      DIFFICULTY: "${MINECRAFT_DIFFICULTY}"
      MODE: "${MINECRAFT_MODE}"
      MEMORY: "${MINECRAFT_MEMORY}"
      LEVEL: "${MINECRAFT_LEVEL}"
      FTB_MODPACK_ID: "${MINECRAFT_FTB_MODPACK_ID}"
      FTB_MODPACK_VERSION_ID: "${MINECRAFT_FTB_MODPACK_VERSION_ID}"

  minecraft-controller:
    build:
      context: .
      dockerfile: ./apps/minecraft-controller/Dockerfile

    environment:
      MINECRAFT_COMPOSE_PROJECT: ${MINECRAFT_COMPOSE_PROJECT}
      # Not env-driven: this must equal the `minecraft` service key above —
      # compose stamps it into the com.docker.compose.service label the
      # controller filters on.
      MINECRAFT_COMPOSE_SERVICE: minecraft
      MINECRAFT_CONTROLLER_TOKEN: ${MINECRAFT_CONTROLLER_TOKEN}
      # Pinned: the bind-mounted root .env sets the host-dev port (8001), and
      # the dev script's --env-file-if-exists would pick it up in here too.
      # Process env wins over --env-file, keeping the container on 8000.
      MINECRAFT_CONTROLLER_PORT: 8000
      MINECRAFT_DATA_ROOT: /server-data
      MINECRAFT_BACKUP_TIMEZONE: ${MINECRAFT_BACKUP_TIMEZONE:-America/Edmonton}
      MINECRAFT_BACKUP_KEEP_HOURLY: ${MINECRAFT_BACKUP_KEEP_HOURLY:-6}
      MINECRAFT_BACKUP_KEEP_DAILY: ${MINECRAFT_BACKUP_KEEP_DAILY:-5}
      MINECRAFT_BACKUP_KEEP_WEEKLY: ${MINECRAFT_BACKUP_KEEP_WEEKLY:-3}
      MINECRAFT_BACKUP_KEEP_MONTHLY: ${MINECRAFT_BACKUP_KEEP_MONTHLY:-2}

    networks:
      - minecraft-controller

    # The docker socket is the service's whole purpose — not a dev-only mount.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Keep persistent data outside the checkout by setting an absolute
      # MINECRAFT_DATA_ROOT in .env. One parent mount preserves recovery renames.
      - ${MINECRAFT_DATA_ROOT:-./data}:/server-data

    stop_grace_period: 30m

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile

    env_file:
      - ./.env
      - ./apps/backend/.env

    environment:
      # The controller resolves by service name inside the compose network;
      # overrides the host default from apps/backend/.env.
      MINECRAFT_CONTROLLER_URL: http://minecraft-controller:8000

    networks:
      - default
      - minecraft-controller

    depends_on:
      db:
        condition: service_healthy
      minecraft-controller:
        condition: service_started

volumes:
  postgres-data:

# Only the backend shares a network with the controller — no other container
# may reach the service holding the docker socket. The bearer token is defense
# in depth on top of this boundary.
networks:
  minecraft-controller:
