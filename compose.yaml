# compose.yaml

services:
  db:
    image: postgres:18

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      target: dev

    env_file: 
      - ./.env
      - ./apps/backend/.env

    ports:
      - "${BACKEND_PORT}:8000"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/backend/node_modules
      - /app/apps/frontend/node_modules
      - /app/packages/shared/node_modules
    
    working_dir: /app/apps/backend

    depends_on:
      - db
      - minecraft

  minecraft:
    image: itzg/minecraft-server

    expose:
      - "25565"
      
    volumes:
      - ./data/minecraft:/data

    env_file: 
      - ./.env

    environment:
      EULA: "TRUE"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${MINECRAFT_RCON_PASSWORD}"

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
      target: dev

    env_file:
      - ./.env
      - ./apps/frontend/.env

    environment:
      # Vite proxies /api inside the compose network; overrides the host
      # default from apps/frontend/.env.
      BACKEND_ORIGIN: http://backend:8000

    ports:
      - "${FRONTEND_PORT}:5173"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/backend/node_modules
      - /app/apps/frontend/node_modules
      - /app/packages/shared/node_modules

volumes:
  postgres-data: