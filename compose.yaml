services:
  db:
    image: postgres:18

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

  backend:
    build:
      context: ./backend
      target: dev

    env_file: 
      - ./.env
      - ./backend/.env

    ports:
      - "${BACKEND_PORT}:8000"

    volumes:
      - ./backend:/app
      - /app/.venv # anonymous volume
    
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      target: dev

    env_file: ./frontend/.env

    ports:
      - "${FRONTEND_PORT}:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules # anonymous volume

volumes:
  postgres-data: