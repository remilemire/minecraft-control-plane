# compose.yaml

# Pinned (rather than derived from the directory name) because the controller
# finds the minecraft container by its com.docker.compose.project label.
name: ${MINECRAFT_COMPOSE_PROJECT}

services:
  db:
    image: postgres:18

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

  
  minecraft:
    image: itzg/minecraft-server

    expose:
      - "25565"

    volumes:
      - ./data/minecraft:/data

    # No env_file: this container must not see the rest of the root .env —
    # notably MINECRAFT_CONTROLLER_TOKEN, which guards the controller against
    # a compromised sibling container (this one included).
    environment:
      EULA: "TRUE"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${MINECRAFT_RCON_PASSWORD}"

  minecraft-controller:
    build:
      context: .
      dockerfile: ./apps/minecraft-controller/Dockerfile
      target: dev

    environment:
      MINECRAFT_COMPOSE_PROJECT: ${MINECRAFT_COMPOSE_PROJECT}
      # Not env-driven: this must equal the `minecraft` service key above —
      # compose stamps it into the com.docker.compose.service label the
      # controller filters on.
      MINECRAFT_COMPOSE_SERVICE: minecraft
      MINECRAFT_CONTROLLER_TOKEN: ${MINECRAFT_CONTROLLER_TOKEN}
      # Pinned: the bind-mounted root .env sets the host-dev port (8001), and
      # the dev script's --env-file-if-exists would pick it up in here too.
      # Process env wins over --env-file, keeping the container on 8000.
      MINECRAFT_CONTROLLER_PORT: 8000

    # Loopback-only publish so a host-run backend (pnpm dev) can reach the
    # controller; the compose network path for other containers is gated by
    # the `minecraft-controller` network below.
    ports:
      - "127.0.0.1:${MINECRAFT_CONTROLLER_PORT}:8000"

    networks:
      - minecraft-controller

    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/backend/node_modules
      - /app/apps/frontend/node_modules
      - /app/apps/minecraft-controller/node_modules
      - /app/packages/shared/node_modules
      - /var/run/docker.sock:/var/run/docker.sock

    working_dir: /app/apps/minecraft-controller

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      target: dev

    env_file:
      - ./.env
      - ./apps/backend/.env

    environment:
      # The controller resolves by service name inside the compose network;
      # overrides the host default from apps/backend/.env.
      MINECRAFT_CONTROLLER_URL: http://minecraft-controller:8000

    ports:
      - "${BACKEND_PORT}:8000"

    networks:
      - default
      - minecraft-controller

    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/backend/node_modules
      - /app/apps/frontend/node_modules
      - /app/apps/minecraft-controller/node_modules
      - /app/packages/shared/node_modules

    working_dir: /app/apps/backend

    depends_on:
      - db
      - minecraft-controller





  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
      target: dev

    env_file:
      - ./.env
      - ./apps/frontend/.env

    environment:
      # Vite proxies /api inside the compose network; overrides the host
      # default from apps/frontend/.env.
      BACKEND_ORIGIN: http://backend:8000

    ports:
      - "${FRONTEND_PORT}:5173"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/backend/node_modules
      - /app/apps/frontend/node_modules
      - /app/apps/minecraft-controller/node_modules
      - /app/packages/shared/node_modules

volumes:
  postgres-data:

# Only the backend shares a network with the controller — no other container
# may reach the service holding the docker socket. The bearer token is defense
# in depth on top of this boundary.
networks:
  minecraft-controller: