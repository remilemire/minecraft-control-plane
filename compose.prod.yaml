# compose.prod.yaml
#
# Prod additions: prod build targets, restart policies, and the Caddy edge.
# Loaded explicitly by the Makefile when APP_ENV=prod (which also skips the
# dev compose.override.yaml — always drive prod through `make`). Published
# port surface: caddy 80/443 and minecraft 25565, nothing else.

services:
  db:
    restart: unless-stopped

  minecraft:
    restart: unless-stopped

  minecraft-controller:
    image: ${MINECRAFT_COMPOSE_PROJECT}-minecraft-controller:${MINECRAFT_RELEASE:-latest}
    environment:
      DOCKER_SOCKET: /docker-host-run/docker.sock
    # Mount the parent so a recreated Unix socket is visible after a daemon
    # outage. Only this already Docker-privileged service sees host runtime IPC.
    volumes:
      - /var/run:/docker-host-run:ro
    restart: unless-stopped
    build:
      target: prod
      args:
        VCS_REF: ${MINECRAFT_RELEASE:-unknown}

  backend:
    image: ${MINECRAFT_COMPOSE_PROJECT}-backend:${MINECRAFT_RELEASE:-latest}
    restart: unless-stopped
    build:
      target: prod
      args:
        VCS_REF: ${MINECRAFT_RELEASE:-unknown}
        # Baked into the SPA bundle at build time (public, not a secret).
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

  # TLS termination for the panel. Kept off the minecraft-controller network —
  # only the backend may reach the service holding the docker socket.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS}
      BACKEND_PORT: ${BACKEND_PORT}

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account state survive restarts.
      - caddy-data:/data
      - caddy-config:/config

    depends_on:
      - backend

volumes:
  caddy-data:
  caddy-config:
